name: Nightly Build & Test

# Weekly checks for drift that happens without a code change, which PR CI
# (ci.yml) cannot see: new beta/nightly compilers breaking the build, and new
# RustSec advisories against an unchanged Cargo.lock.

on:
  schedule:
    # Every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  toolchain-drift:
    name: Test Suite (ubuntu-latest, ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rust: [beta, nightly]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: nightly-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          nightly-${{ matrix.rust }}-

    # Same packages and test steps as ci.yml's Ubuntu test job
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev libglib2.0-dev cmake clang libclang-dev

    - name: Run tests
      run: cargo test --verbose

    - name: Run integration tests
      run: cargo test --test integration_tests --features "gguf,onnx"

    - name: Compile every integration suite
      run: bash scripts/integration-suites.sh

    - name: Run doctests
      run: cargo test --doc

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    # Honors the acknowledged advisories in .cargo/audit.toml
    - name: Run security audit
      run: cargo audit
